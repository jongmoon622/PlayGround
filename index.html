<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0d211f" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>장작꾼 — Lumberjack</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app">
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header class="hud">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2 22 8c0 4-2 6-6 7l-3-5-4-4Z"/>
            <path d="M4.11 19.84 2.12 18.33 9.19 9 11 10.81 4.11 19.84Z" opacity=".88"/>
          </svg>
        </span>
        <span class="brand__copy">
          <strong>장작꾼</strong>
          <small>LUMBERJACK</small>
        </span>
      </div>

      <div class="score" id="scoreCard" aria-live="polite" aria-atomic="true">
        <span class="score__icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <rect x="7" y="18" width="30" height="13" rx="6.5" fill="#8B5A2B"/>
            <rect x="7" y="18" width="30" height="5.2" rx="2.6" fill="#C58C4D" opacity=".55"/>
            <ellipse cx="37" cy="24.5" rx="6.4" ry="6.7" fill="#E5B77E"/>
            <ellipse cx="37" cy="24.5" rx="4.1" ry="4.4" fill="#C88D50"/>
            <ellipse cx="37" cy="24.5" rx="1.8" ry="2" fill="#9B6534"/>
            <path d="M13 23.2h12M12 28.4h7" stroke="#5A371B" stroke-width="1.5" stroke-linecap="round" opacity=".65"/>
            <path d="M15 18.3c.8-2.4 3-4 5.8-4.1" stroke="#D9A465" stroke-width="1.6" stroke-linecap="round" opacity=".5"/>
          </svg>
        </span>
        <span class="score__copy">
          <small>장작</small>
          <strong><span id="scoreValue">0</span><em>개</em></strong>
        </span>
      </div>
    </header>

    <div class="toast" id="toast" aria-hidden="true">
      <span class="toast__spark">✦</span>
      <span id="toastText">장작 10개!</span>
      <span class="toast__spark">✦</span>
    </div>

    <p class="hint" id="hint">
      <span class="hint__dot" aria-hidden="true"></span>
      버튼을 눌러 장작을 패세요
    </p>

    <footer class="controls">
      <button id="chopButton" class="chop" type="button" aria-label="도끼로 장작 패기">
        <span class="chop__halo" aria-hidden="true"></span>
        <span class="chop__face">
          <span class="chop__shine" aria-hidden="true"></span>
          <span class="chop__axe" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 2 22 8c0 4-2 6-6 7l-3-5-4-4Z" fill="#E9EFEA" stroke="#4A2410" stroke-width="1.15" stroke-linejoin="round"/>
              <path d="M4.11 19.84 2.12 18.33 9.19 9 11 10.81 4.11 19.84Z" fill="#8C5A2E" stroke="#4A2410" stroke-width="1.15" stroke-linejoin="round"/>
              <path d="M20.5 8.9c-.3 2.8-2.2 4.6-5.2 5.5" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".9"/>
              <path d="M4.9 17.7 6.4 15.9" stroke="#C58C4D" stroke-width=".75" stroke-linecap="round" opacity=".9"/>
            </svg>
          </span>
          <span class="chop__label">장작 패기</span>
          <span class="chop__sub">TAP TO CHOP</span>
        </span>
        <span class="chop__ripple" id="ripple" aria-hidden="true"></span>
      </button>
      <p class="footer-note" id="footerNote">한 번의 터치, 한 개의 장작</p>
    </footer>
  </main>
  <script type="module" src="./src/game.js"></script>
</body>
</html>
