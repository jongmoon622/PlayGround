<html lang="ko">
<head>

<title>잿빛 항로 — 방랑자의 기록</title>
<style>
:root{--bg:#101510;--panel:#1a211b;--panel2:#222b23;--line:#364337;--text:#e8e4d7;--muted:#a2aa9a;--gold:#d8b66c;--green:#9eb98a;--red:#d97666;--blue:#8eb8c3;--serif:Georgia,'Noto Serif KR',serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#2b3828 0,#121812 55%,#0d120f 100%);color:var(--text);font:15px/1.6 'Noto Sans KR',system-ui,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;color:inherit}.shell{max-width:1280px;margin:auto;padding:20px 24px 40px}.topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0 15px;margin-bottom:20px}.brand{font:small-caps 700 20px var(--serif);letter-spacing:2px;color:var(--gold)}.brand span{color:var(--muted);font:12px system-ui;letter-spacing:1px;margin-left:12px}.top-actions{display:flex;gap:8px}.quiet{background:none;border:1px solid var(--line);padding:7px 12px;border-radius:4px;color:var(--muted);font-size:12px}.quiet:hover{border-color:var(--gold);color:var(--gold)}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:2px;text-transform:uppercase}.title{font:500 32px/1.3 var(--serif);margin:5px 0 8px}.subtitle{color:var(--muted);margin:0}.panel{background:linear-gradient(145deg,rgba(34,43,35,.96),rgba(24,31,25,.97));border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 35px #0002}.btn{border:1px solid #816b42;background:linear-gradient(180deg,#b99a5c,#897143);color:#17170f;padding:10px 18px;font-weight:700;border-radius:4px;box-shadow:0 3px 12px #0003;transition:.16s}.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn.secondary{border-color:var(--line);background:#222b23;color:var(--text);box-shadow:none}.btn.danger{border-color:#834c41;background:#653b34;color:#f5e4d8}.btn.small{padding:7px 11px;font-size:12px}.hidden{display:none!important}
#creator{max-width:940px;margin:42px auto}.hero{padding:34px 38px;background:linear-gradient(110deg,#17211ddd,#17211d88),radial-gradient(ellipse at 80% 20%,#7b7244,#253727 50%,#17211d);border-radius:9px 9px 0 0;border:1px solid var(--line);position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:9%;top:3%;font-size:170px;color:#d8b66c14}.hero .title{font-size:40px}.creator-body{padding:28px 34px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}.field label,.section-label{display:block;color:var(--gold);font-size:12px;letter-spacing:.5px;margin-bottom:8px}.field input,.field select{width:100%;padding:11px 12px;background:#111712;color:var(--text);border:1px solid var(--line);border-radius:4px;outline:none}.field input:focus,.field select:focus{border-color:var(--gold)}.choice-row{display:flex;gap:8px}.choice{flex:1;background:#141a15;border:1px solid var(--line);padding:10px;border-radius:4px;color:var(--muted)}.choice.active{border-color:var(--gold);color:var(--gold);background:#292719}.race-grid,.mastery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.pick-card{background:#151c16;border:1px solid var(--line);border-radius:5px;padding:12px;text-align:left;transition:.15s}.pick-card:hover,.pick-card.active{border-color:var(--gold);background:#262a1e}.pick-card strong{display:block;color:var(--text);font-size:14px}.pick-card small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.pick-card em{display:block;font-style:normal;color:var(--green);font-size:11px;margin-top:6px}.stats-editor{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat-control{display:flex;align-items:center;justify-content:space-between;background:#151c16;border:1px solid var(--line);padding:8px;border-radius:4px}.stat-control span{font-size:12px;color:var(--muted)}.stat-control b{min-width:20px;text-align:center}.stat-control button{border:0;background:#303a2e;width:24px;height:24px;border-radius:3px;color:var(--gold)}.form-footer{display:flex;justify-content:space-between;align-items:center;margin-top:25px;padding-top:20px;border-top:1px solid var(--line)}
.game-layout{display:grid;grid-template-columns:270px minmax(0,1fr) 260px;gap:16px;align-items:start}.sidebar,.rightbar{display:flex;flex-direction:column;gap:14px}.card{padding:16px}.char-card{padding:17px}.avatar{height:110px;border-radius:5px;background:linear-gradient(140deg,#323b2c,#1a251e);display:grid;place-items:center;font-size:42px;margin-bottom:12px;border:1px solid #46513e}.char-name{font:22px var(--serif);margin:0}.race-line{color:var(--muted);font-size:12px}.stat-bars{display:grid;gap:9px;margin:14px 0}.bar-head{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:3px}.bar{height:6px;background:#101510;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red);border-radius:9px}.bar.mana i{background:#7d9ec2}.bar.xp i{background:var(--gold)}.statline{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.chip{font-size:10px;border:1px solid var(--line);border-radius:20px;padding:3px 7px;color:var(--muted)}.resource-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.resource{display:flex;justify-content:space-between;padding:6px 8px;background:#141a15;border-radius:3px;font-size:12px}.resource span{color:var(--muted)}.middle{min-width:0}.region-head{padding:18px 20px;background:linear-gradient(110deg,#1b281fdd,#1b281f99),radial-gradient(ellipse at 90% 15%,#596744,#23342b 55%,#1b281f);border:1px solid var(--line);border-radius:7px 7px 0 0}.region-head .title{font-size:25px}.region-meta{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.region-view{padding:18px 20px;border-top:0;border-radius:0 0 7px 7px}.story{min-height:180px;max-height:270px;overflow:auto;padding-right:5px}.story p{margin:0 0 12px;color:#d4d5c9}.story .time{font-size:10px;color:var(--gold);letter-spacing:1px;margin:14px 0 4px}.story .system{color:var(--green);font-style:italic}.actions-title{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.actions-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.action{min-height:100px;padding:12px;background:#182119;border:1px solid var(--line);border-radius:5px;text-align:left}.action:hover{border-color:#9c8955;background:#232b20}.action .icon{font-size:21px;display:block;margin-bottom:6px}.action strong{font-size:13px}.action small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.location-list{display:grid;gap:8px}.location{display:flex;gap:10px;align-items:center;padding:10px;background:#151c16;border:1px solid var(--line);border-radius:5px;cursor:pointer}.location:hover,.location.active{border-color:var(--gold)}.location .locicon{font-size:22px}.location strong{display:block;font-size:12px}.location small{color:var(--muted);font-size:10px}.location .arr{margin-left:auto;color:var(--muted)}.skill-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #303a303f;font-size:11px}.skill-row:last-child{border:0}.skill-row .dot{width:7px;height:7px;background:#64745b;border-radius:50%}.skill-row .skill-name{flex:1}.skill-row b{color:var(--gold);font-weight:500}.skill-row.locked{opacity:.48}.skill-row.locked .dot{background:#51564e}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.section-head h3{margin:0;font:17px var(--serif)}.tiny{font-size:10px;color:var(--muted)}
.modal-back{position:fixed;inset:0;background:#080b09c9;display:grid;place-items:center;padding:16px;z-index:5}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;padding:22px;background:#1a211b;border:1px solid #59634a;border-radius:7px;box-shadow:0 20px 70px #0009}.modal-head{display:flex;align-items:start;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:15px}.modal-head h2{font:23px var(--serif);margin:0}.close{background:none;border:0;color:var(--muted);font-size:22px}.encounter{padding:15px;background:#181e18;border:1px solid var(--line);border-radius:5px;margin:12px 0}.enemy-top{display:flex;justify-content:space-between}.enemy-top strong{font:19px var(--serif)}.combat-log{min-height:75px;padding:11px;background:#111712;color:#c5cabb;font-size:13px;border-radius:4px;margin:12px 0}.combat-actions,.recipe-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}.combat-actions button,.recipe{padding:10px;background:#232b23;border:1px solid var(--line);border-radius:4px;text-align:left}.combat-actions button:hover,.recipe:hover{border-color:var(--gold)}.recipe{display:flex;justify-content:space-between;gap:9px;align-items:center}.recipe strong{font-size:12px}.recipe small{color:var(--muted);display:block}.recipe:disabled{opacity:.42;cursor:not-allowed}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#d8b66c;color:#17170f;padding:10px 18px;border-radius:4px;font-size:13px;font-weight:700;z-index:10;box-shadow:0 5px 25px #0007}.empty-note{color:var(--muted);font-size:12px;text-align:center;padding:15px}.footnote{font-size:10px;color:var(--muted);margin-top:12px}
@media(max-width:980px){.game-layout{grid-template-columns:230px minmax(0,1fr)}.rightbar{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.actions-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.shell{padding:12px 12px 28px}.topbar{margin-bottom:12px}.brand{font-size:16px}.brand span{display:none}.game-layout{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:9px}.char-card{grid-column:1/-1;display:grid;grid-template-columns:78px 1fr;column-gap:12px}.avatar{height:78px;grid-row:span 2;margin:0;font-size:30px}.char-card .stat-bars{grid-column:1/-1;margin-bottom:0}.rightbar{grid-column:auto;display:grid;grid-template-columns:1fr}.middle{grid-row:1}.sidebar{grid-row:2}.rightbar{grid-row:3}.region-head{padding:15px}.region-view{padding:14px}.title{font-size:27px}.hero{padding:24px 20px}.hero .title{font-size:32px}.creator-body{padding:20px}.form-grid{grid-template-columns:1fr;gap:17px}.race-grid,.mastery-grid{grid-template-columns:1fr 1fr}.stats-editor{grid-template-columns:1fr 1fr}.actions-grid{grid-template-columns:1fr 1fr}.action{min-height:92px}.form-footer{gap:10px;align-items:flex-end}.form-footer .footnote{max-width:55%}.story{max-height:240px}}
</style>

<body>
<div class="shell"><header class="topbar"><div class="brand">✦ 잿빛 항로 <span>방랑자의 기록</span></div><div class="top-actions"><button class="quiet" id="saveBtn">기록 저장</button><button class="quiet" id="resetBtn">새 여정</button></div></header>
<section id="creator"></section><main id="game" class="hidden"></main></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const RACES=[{id:'human',name:'인간',desc:'어디에나 적응하는 여행자',bonus:'모든 능력치 +1'}, {id:'elf',name:'엘프',desc:'숲과 마력의 오래된 수호자',bonus:'민첩 +2 · 지혜 +1'}, {id:'dwarf',name:'드워프',desc:'산맥에서 단련된 장인',bonus:'체력 +2 · 힘 +1'}, {id:'beastkin',name:'수인',desc:'예민한 감각과 야성의 피',bonus:'민첩 +2 · 감각 +1'}, {id:'sylvan',name:'실바',desc:'자연의 숨결을 읽는 종족',bonus:'지혜 +2 · 감각 +1'}, {id:'ashen',name:'잿빛 혈족',desc:'오래전 마법의 재에서 태어난 자',bonus:'지혜 +2 · 체력 +1'}];
const MASTERY=[{id:'blade',name:'검술',icon:'⚔',desc:'검을 휘둘러 전장을 지배한다',skill:'연속 베기'}, {id:'bow',name:'궁술',icon:'➶',desc:'멀리서 약점을 꿰뚫는다',skill:'관통 사격'}, {id:'arcane',name:'비전 마법',icon:'✧',desc:'마나를 다뤄 불꽃과 보호막을 부른다',skill:'화염구'}, {id:'herbal',name:'약초 채집',icon:'❀',desc:'풀잎의 효능과 숨은 군락을 찾는다',skill:'정밀 채집'}, {id:'mining',name:'광맥 탐사',icon:'⛏',desc:'암맥을 읽어 귀한 광물을 캐낸다',skill:'맥 짚기'}, {id:'tracking',name:'추적과 사냥',icon:'♧',desc:'흔적을 좇아 먹잇감을 찾아낸다',skill:'기습 사냥'}];
const STAT_NAMES={str:'힘',dex:'민첩',vit:'체력',wis:'지혜'};const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let create={name:'',gender:'여성',race:'human',stats:{str:2,dex:2,vit:2,wis:2},mastery:'blade'};
function renderCreator(){const race=RACES.find(x=>x.id===create.race);$('#creator').innerHTML=`<div class="panel"><div class="hero"><div class="eyebrow">A text adventure · 01 / 06</div><h1 class="title">잿빛 너머, 새로운 길</h1><p class="subtitle">지도 끝의 미지로 떠나는 당신만의 판타지 여정.</p></div><div class="creator-body"><div class="form-grid"><div class="field"><label>방랑자의 이름</label><input id="charName" maxlength="16" placeholder="이름을 적어주세요" value="${esc(create.name)}"></div><div class="field"><label>성별</label><div class="choice-row">${['여성','남성','논바이너리'].map(g=>`<button class="choice ${create.gender===g?'active':''}" data-gender="${g}">${g}</button>`).join('')}</div></div><div class="field" style="grid-column:1/-1"><label>종족 · ${race.bonus}</label><div class="race-grid">${RACES.map(r=>`<button class="pick-card ${create.race===r.id?'active':''}" data-race="${r.id}"><strong>${r.name}</strong><small>${r.desc}</small><em>${r.bonus}</em></button>`).join('')}</div></div><div class="field" style="grid-column:1/-1"><label>초기 능력치 <span style="color:var(--muted)">— 분배할 점수 <b id="pointsLeft">2</b></span></label><div class="stats-editor">${Object.entries(create.stats).map(([k,v])=>`<div class="stat-control"><span>${STAT_NAMES[k]}</span><button data-stat="${k}" data-delta="-1">−</button><b>${v}</b><button data-stat="${k}" data-delta="1">+</button></div>`).join('')}</div></div><div class="field" style="grid-column:1/-1"><label>첫 마스터리 · 시작 기술이 해금됩니다</label><div class="mastery-grid">${MASTERY.map(m=>`<button class="pick-card ${create.mastery===m.id?'active':''}" data-mastery="${m.id}"><strong>${m.icon} ${m.name}</strong><small>${m.desc}</small><em>시작 기술: ${m.skill}</em></button>`).join('')}</div></div></div><div class="form-footer"><span class="footnote">모든 선택은 여정 중 성장의 방향을 바꿉니다.</span><button class="btn" id="beginBtn">여정 시작하기　→</button></div></div></div>`;
$('#charName').addEventListener('input',e=>create.name=e.target.value);document.querySelectorAll('[data-gender]').forEach(b=>b.onclick=()=>{create.gender=b.dataset.gender;renderCreator()});document.querySelectorAll('[data-race]').forEach(b=>b.onclick=()=>{create.race=b.dataset.race;renderCreator()});document.querySelectorAll('[data-mastery]').forEach(b=>b.onclick=()=>{create.mastery=b.dataset.mastery;renderCreator()});document.querySelectorAll('[data-stat]').forEach(b=>b.onclick=()=>{let sum=Object.values(create.stats).reduce((a,b)=>a+b,0),k=b.dataset.stat,d=+b.dataset.delta;if(d<0&&create.stats[k]>1)create.stats[k]--;if(d>0&&sum<10)create.stats[k]++;renderCreator()});$('#beginBtn').onclick=startGame;$('#pointsLeft').textContent=10-Object.values(create.stats).reduce((a,b)=>a+b,0)}
const REGIONS=[{id:'moss',name:'이끼 낀 변경숲',icon:'🌲',desc:'낮은 안개와 오래된 발자국',danger:1,story:'나무들이 바람에 몸을 기울인다. 축축한 흙 아래 오래된 길의 흔적이 이어진다.'},{id:'ridge',name:'바람깎인 능선',icon:'⛰️',desc:'광맥과 매서운 바람',danger:2,story:'돌바람이 뺨을 스친다. 바위틈마다 푸른 광맥이 희미하게 반짝인다.'},{id:'marsh',name:'달빛 늪지',icon:'🌙',desc:'희귀한 약초와 낯선 울음',danger:2,story:'물안개 사이로 푸른 꽃이 빛난다. 수면 아래 무언가가 당신의 발걸음을 좇는다.'}];
let game=null;function freshGame(){let race=RACES.find(r=>r.id===create.race),stats={...create.stats};if(create.race==='human')Object.keys(stats).forEach(k=>stats[k]++);if(create.race==='elf'){stats.dex+=2;stats.wis++}if(create.race==='dwarf'){stats.vit+=2;stats.str++}if(create.race==='beastkin'){stats.dex+=2;stats.wis++}if(create.race==='sylvan'){stats.wis+=2;stats.dex++}if(create.race==='ashen'){stats.wis+=2;stats.vit++}return{name:create.name.trim()||'이름 없는 방랑자',gender:create.gender,race,stats,mastery:{blade:0,bow:0,arcane:0,herbal:0,mining:0,tracking:0},unlocked:[],startMastery:create.mastery,hp:30+stats.vit*3,maxHp:30+stats.vit*3,mana:12+stats.wis*2,maxMana:12+stats.wis*2,level:1,xp:0,day:1,region:'moss',inventory:{'말린 식량':3,'약초':1},gold:8,log:[],visited:['moss'],combat:null,turn:0}}function startGame(){game=freshGame();game.mastery[create.mastery]=2;game.unlocked.push(MASTERY.find(m=>m.id===create.mastery).skill);game.log.push({type:'system',text:`${game.name}은(는) 낡은 나침반 하나를 쥐고 변경숲의 길에 들어섰다. 모든 여정은 작은 흔적에서 시작된다.`});$('#creator').classList.add('hidden');$('#game').classList.remove('hidden');renderGame();saveGame(false)}
function log(text,type=''){game.log.push({text,type});if(game.log.length>35)game.log.shift()}function currentRegion(){return REGIONS.find(r=>r.id===game.region)}function addItem(n,q=1){game.inventory[n]=(game.inventory[n]||0)+q}function takeItem(n,q=1){if((game.inventory[n]||0)<q)return false;game.inventory[n]-=q;if(!game.inventory[n])delete game.inventory[n];return true}function gainMastery(id,amount=1){let m=MASTERY.find(x=>x.id===id);if(!m)return;let before=game.mastery[id];game.mastery[id]+=amount;let now=game.mastery[id];let unlocks=({blade:[3,'회전 베기',6,'방패 가르기'],bow:[3,'정밀 조준',6,'연발 사격'],arcane:[3,'서리 창',6,'비전 방벽'],herbal:[3,'약초 감별',6,'풍요의 손길'],mining:[3,'광맥 감지',6,'정교한 채굴'],tracking:[3,'덫 설치',6,'치명적 급습']})[id];for(let i=0;i<unlocks.length;i+=2){if(before<unlocks[i]&&now>=unlocks[i]){game.unlocked.push(unlocks[i+1]);log(`마스터리 성장! ${m.name} ${now}단계 — 「${unlocks[i+1]}」 기술을 익혔다.`, 'system');toast(`기술 해금: ${unlocks[i+1]}`)}}}
function gainXp(n){game.xp+=n;while(game.xp>=game.level*30){game.xp-=game.level*30;game.level++;game.maxHp+=5;game.maxMana+=2;game.hp=game.maxHp;game.mana=game.maxMana;log(`경험을 쌓아 레벨 ${game.level}이 되었다. 체력과 마력이 회복된다.`,'system');toast(`레벨 ${game.level} 달성!`)}}
function tick(){game.turn++;if(game.turn%5===0){game.day++;if(!takeItem('말린 식량')){game.hp=Math.max(1,game.hp-3);log('식량이 떨어져 허기가 진다. 체력 3을 잃었다.','system')}else log('야영지에서 식량 한 끼를 먹었다.')} }
function toast(msg){let root=$('#toastRoot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>root.innerHTML='',1900)}
function renderGame(){if(!game)return;let r=currentRegion(),mastery=MASTERY.map(m=>{let v=game.mastery[m.id],unlocks=({blade:[3,'회전 베기',6,'방패 가르기'],bow:[3,'정밀 조준',6,'연발 사격'],arcane:[3,'서리 창',6,'비전 방벽'],herbal:[3,'약초 감별',6,'풍요의 손길'],mining:[3,'광맥 감지',6,'정교한 채굴'],tracking:[3,'덫 설치',6,'치명적 급습']})[m.id];return `<div class="skill-row ${v===0?'locked':''}"><span class="dot"></span><span class="skill-name">${m.icon} ${m.name}</span><b>${v}</b></div>${unlocks.map((x,i)=>i%2===0?`<div class="skill-row ${v>=x?'':'locked'}"><span class="dot"></span><span class="skill-name">${unlocks[i+1]} <small>(숙련 ${x})</small></span>${v>=x?'<b>해금</b>':''}</div>`:'').join('')}`}).join('');let inv=Object.entries(game.inventory).filter(x=>x[1]>0);$('#game').innerHTML=`<div class="game-layout"><aside class="sidebar"><section class="panel char-card"><div class="avatar">${game.race.id==='elf'?'🧝':game.race.id==='dwarf'?'🧔':game.race.id==='beastkin'?'🐺':game.race.id==='sylvan'?'🧚':game.race.id==='ashen'?'🧙':'🧭'}</div><div><h2 class="char-name">${esc(game.name)}</h2><div class="race-line">${game.gender} ${game.race.name} · 레벨 ${game.level}</div><div class="statline">${Object.entries(game.stats).map(([k,v])=>`<span class="chip">${STAT_NAMES[k]} ${v}</span>`).join('')}</div></div><div class="stat-bars"><div><div class="bar-head"><span>체력</span><span>${game.hp} / ${game.maxHp}</span></div><div class="bar"><i style="width:${game.hp/game.maxHp*100}%"></i></div></div><div><div class="bar-head"><span>마나</span><span>${game.mana} / ${game.maxMana}</span></div><div class="bar mana"><i style="width:${game.mana/game.maxMana*100}%"></i></div></div><div><div class="bar-head"><span>경험치 · 다음 레벨</span><span>${game.xp} / ${game.level*30}</span></div><div class="bar xp"><i style="width:${game.xp/(game.level*30)*100}%"></i></div></div></div></section><section class="panel card"><div class="section-head"><h3>소지품</h3><span class="tiny">◈ ${game.gold} 은화</span></div>${inv.length?`<div class="resource-list">${inv.map(([n,q])=>`<div class="resource"><span>${n}</span><b>×${q}</b></div>`).join('')}</div>`:'<div class="empty-note">가방이 비어 있습니다.</div>'}<div class="footnote">짐은 길 위에서 얻고, 야영 때 식량을 소모합니다.</div></section></aside><section class="middle"><div class="region-head"><div class="eyebrow">제 ${game.day}일째 · 탐험 중</div><h1 class="title">${r.icon} ${r.name}</h1><p class="subtitle">${r.desc}</p><div class="region-meta"><span class="chip">위험도 ${'◆'.repeat(r.danger)}${'◇'.repeat(3-r.danger)}</span><span class="chip">${game.region==='moss'?'숲길':game.region==='ridge'?'고산 지대':'늪지'}</span><span class="chip">오전 ${8+(game.turn%12)}시</span></div></div><div class="panel region-view"><div class="story" id="story">${game.log.map(l=>`<div class="time">${l.type==='system'?'✦ 여정의 기록':'— 주변의 흔적'}</div><p class="${l.type==='system'?'system':''}">${esc(l.text)}</p>`).join('')}</div><div class="actions-title"><h3 style="font:17px var(--serif);margin:0">무엇을 할까?</h3><span class="tiny">행동은 시간과 숙련을 쌓습니다</span></div><div class="actions-grid"><button class="action" data-action="explore"><span class="icon">🧭</span><strong>주변 탐색</strong><small>흔적과 사건을 발견한다</small></button><button class="action" data-action="hunt"><span class="icon">🏹</span><strong>사냥하기</strong><small>먹잇감을 추적하고 전투한다</small></button><button class="action" data-action="herbal"><span class="icon">🌿</span><strong>약초 채집</strong><small>풀과 버섯을 채집한다</small></button><button class="action" data-action="mine"><span class="icon">⛏️</span><strong>광물 채굴</strong><small>광석과 돌을 캐낸다</small></button><button class="action" data-action="craft"><span class="icon">⚒️</span><strong>제작과 조리</strong><small>재료를 도구와 물자로 바꾼다</small></button><button class="action" data-action="rest"><span class="icon">🔥</span><strong>야영과 휴식</strong><small>체력과 마나를 회복한다</small></button></div></div></section><aside class="rightbar"><section class="panel card"><div class="section-head"><h3>여행 지도</h3><span class="tiny">장소 ${game.visited.length}/3</span></div><div class="location-list">${REGIONS.map(loc=>`<div class="location ${loc.id===game.region?'active':''}" data-travel="${loc.id}"><span class="locicon">${loc.icon}</span><div><strong>${loc.name}</strong><small>${game.visited.includes(loc.id)?'방문함':'미답 지역'} · 위험 ${loc.danger}/3</small></div><span class="arr">${loc.id===game.region?'●':'›'}</span></div>`).join('')}</div><div class="footnote">새 장소로 이동하면 탐험 기회가 열립니다.</div></section><section class="panel card"><div class="section-head"><h3>마스터리</h3><span class="tiny">활동으로 성장</span></div>${mastery}</section></aside></div>`;
$('#story').scrollTop=$('#story').scrollHeight;document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-travel]').forEach(b=>b.onclick=()=>travel(b.dataset.travel));}
function action(kind){if(game.combat){toast('전투 중에는 다른 행동을 할 수 없습니다.');return}if(kind==='craft'){openCraft();return}if(kind==='rest'){rest();return}tick();if(kind==='explore')explore();if(kind==='hunt')hunt();if(kind==='herbal')gather('herbal');if(kind==='mine')gather('mining');renderGame();saveGame(false)}
function gather(type){let reg=game.region,herb=type==='herbal',options=herb?(reg==='marsh'?['달빛 이끼','약초','약초']:['약초','약초','쓴풀']):(reg==='ridge'?['철광석','철광석','수정']:['돌 조각','철광석']);let item=options[Math.floor(Math.random()*options.length)],qty=Math.random()<.25?2:1;addItem(item,qty);gainMastery(type);log(`${herb?'풀잎 사이에서':'바위 틈에서'} ${item} ${qty}개를 얻었다.${game.mastery[type]>=3&&game.mastery[type]-(qty===2?0:1)>=2?' 숙련된 손길로 채집이 한결 수월해졌다.':''}`);if(Math.random()<.16&&reg!=='moss'){log('덤불에서 작은 생물이 튀어나왔다!');beginCombat('늪지 들개',12+game.level*2,4,3)}}
function hunt(){gainMastery('tracking');let difficulty=currentRegion().danger;let names=game.region==='marsh'?['늪지 들개','독침 멧돼지','안개 도마뱀']:game.region==='ridge'?['산양','바위늑대','절벽 독수리']:['숲토끼','뿔사슴','숲늑대'];let name=names[Math.floor(Math.random()*names.length)];if(Math.random()<.18&&difficulty===1){addItem('말린 식량',1);gainXp(4);log(`발자국을 따라가 작은 사냥감의 흔적을 찾았다. 말린 식량 1개를 챙겼다.`);return}let hp=10+game.level*3+difficulty*5;log(`흙에 선명한 발자국이 찍혀 있다. ${name}이(가) 모습을 드러냈다!`);beginCombat(name,hp,4+difficulty*2,3+difficulty)}
function explore(){let roll=Math.random();if(roll<.23){let found=game.region==='ridge'?'은화':game.region==='marsh'?'달빛 이끼':'말린 식량';let q=found==='은화'?4+Math.floor(Math.random()*6):1; if(found==='은화')game.gold+=q;else addItem(found,q);log(`낡은 흔적을 살피다 ${found} ${q>1?q+'개':''}을 발견했다.`);gainXp(5)}else if(roll<.52){log(currentRegion().story);gainMastery('tracking');gainXp(3)}else if(roll<.8){let name=game.region==='marsh'?'안개 사냥꾼':game.region==='ridge'?'바위늑대':'숲늑대';log(`길가에서 위협적인 기척이 다가온다. ${name}과(와) 마주쳤다!`);beginCombat(name,12+game.level*3,5+currentRegion().danger,4)}else{let q=1+Math.floor(Math.random()*2);addItem('약초',q);log(`바람에 실린 향을 따라가 약초 ${q}개를 찾았다.`);gainMastery('herbal');gainXp(4)}}
function travel(id){if(id===game.region)return;if(game.combat){toast('전투가 끝난 뒤 이동할 수 있습니다.');return}tick();let first=!game.visited.includes(id);game.region=id;if(first){game.visited.push(id);log(`${currentRegion().name}에 도착했다. 낯선 풍경이 눈앞에 펼쳐지고, 지도의 가장자리가 넓어졌다.`,'system');gainXp(8)}else log(`${currentRegion().name}(으)로 되돌아왔다.`);renderGame();saveGame(false)}
function rest(){tick();if(game.hp<game.maxHp||game.mana<game.maxMana){game.hp=Math.min(game.maxHp,game.hp+Math.ceil(game.maxHp*.42));game.mana=Math.min(game.maxMana,game.mana+Math.ceil(game.maxMana*.55));log('작은 불가에 몸을 녹이며 숨을 골랐다. 체력과 마나가 회복되었다.','system')}else{log('하늘 아래 잠시 쉬며 다음 길을 가늠했다.');}if(!takeItem('말린 식량')){game.hp=Math.max(1,game.hp-4);log('식량 없이 야영했다. 허기로 체력 4를 잃었다.')}renderGame();saveGame(false)}
const RECIPES=[{name:'약초 연고',desc:'체력 12 회복',in:{'약초':2},out:'약초 연고',qty:1},{name:'말린 식량',desc:'여행 식량 2인분',in:{'쓴풀':1},out:'말린 식량',qty:2},{name:'철제 화살촉',desc:'은화 5개',in:{'철광석':2},out:'은화',qty:5},{name:'수정 부적',desc:'마나 10 회복',in:{'수정':1,'달빛 이끼':1},out:'수정 부적',qty:1},{name:'야영용 도구',desc:'다음 휴식 체력 회복 +',in:{'철광석':1,'돌 조각':2},out:'야영용 도구',qty:1}];
function openCraft(){let root=$('#modalRoot');root.innerHTML=`<div class="modal-back" id="craftBack"><div class="modal"><div class="modal-head"><div><div class="eyebrow">작업대 · 보유 재료로 제작</div><h2>제작과 조리</h2></div><button class="close" data-close>×</button></div><div class="recipe-list">${RECIPES.map((r,i)=>{let ok=Object.entries(r.in).every(([n,q])=>(game.inventory[n]||0)>=q);return `<button class="recipe" data-recipe="${i}" ${ok?'':'disabled'}><span><strong>${r.name}</strong><small>${Object.entries(r.in).map(([n,q])=>`${n} ×${q}`).join(' · ')}</small></span><span class="tiny">${r.desc}</span></button>`}).join('')}</div><p class="footnote">제작 숙련은 해당 마스터리 활동으로 오릅니다.</p></div></div>`;root.querySelector('[data-close]').onclick=()=>root.innerHTML='';root.querySelector('#craftBack').onclick=e=>{if(e.target.id==='craftBack')root.innerHTML=''};root.querySelectorAll('[data-recipe]').forEach(b=>b.onclick=()=>craft(+b.dataset.recipe))}
function craft(i){let rec=RECIPES[i];if(!Object.entries(rec.in).every(([n,q])=>(game.inventory[n]||0)>=q)){toast('재료가 부족합니다.');return}Object.entries(rec.in).forEach(([n,q])=>takeItem(n,q));if(rec.out==='은화')game.gold+=rec.qty;else addItem(rec.out,rec.qty);if(rec.out==='약초 연고')log('약초를 빻아 상처에 바를 연고를 만들었다.');else log(`${rec.name}을(를) 완성했다.`);gainMastery('herbal');tick();$('#modalRoot').innerHTML='';renderGame();saveGame(false)}
function beginCombat(name,hp,damage,xp){game.combat={name,hp,maxHp:hp,damage,xp};renderCombat(`${name}이(가) 당신을 향해 달려든다. 어떻게 대응할까?`)}
function renderCombat(message=''){if(!game.combat)return;let c=game.combat,abilities=game.unlocked.filter(x=>['연속 베기','회전 베기','방패 가르기','관통 사격','정밀 조준','연발 사격','화염구','서리 창','비전 방벽','치명적 급습'].includes(x));let skillButtons=abilities.map(x=>`<button data-fight="skill:${x}">✦ ${x}${['화염구','서리 창','비전 방벽'].includes(x)?' · 마나 4':''}</button>`).join('');$('#modalRoot').innerHTML=`<div class="modal-back"><div class="modal"><div class="modal-head"><div><div class="eyebrow">조우 · 턴제 전투</div><h2>⚔ ${esc(c.name)}</h2></div><span class="chip">적 체력 ${c.hp} / ${c.maxHp}</span></div><div class="encounter"><div class="enemy-top"><strong>${esc(c.name)}</strong><span>위협도 ${'◆'.repeat(Math.min(3,Math.ceil(c.damage/3)))}</span></div><div class="bar" style="margin-top:9px"><i style="width:${c.hp/c.maxHp*100}%;background:var(--red)"></i></div></div><div class="combat-log">${esc(message||'상대가 빈틈을 노린다.')}</div><div class="combat-actions"><button data-fight="attack">⚔ 기본 공격</button>${skillButtons}<button data-fight="potion">✚ 약초 연고 사용 (${game.inventory['약초 연고']||0})</button><button data-fight="flee">↗ 도주 시도</button></div><p class="footnote">체력 ${game.hp}/${game.maxHp} · 마나 ${game.mana}/${game.maxMana} · 행동마다 상대가 반격합니다.</p></div></div>`;document.querySelectorAll('[data-fight]').forEach(b=>b.onclick=()=>fight(b.dataset.fight))}
function fight(move){let c=game.combat;if(!c)return;let msg='',damage=0;if(move==='flee'){if(Math.random()<.58){log(`${c.name}에게서 무사히 벗어났다.`);game.combat=null;$('#modalRoot').innerHTML='';renderGame();saveGame(false);return}else msg='도주로가 막혔다!'}else if(move==='potion'){if(takeItem('약초 연고')){game.hp=Math.min(game.maxHp,game.hp+12);msg='약초 연고를 발랐다. 체력 12 회복.'}else msg='사용할 약초 연고가 없다.'}else if(move.startsWith('skill:')){let sk=move.slice(6);if(['화염구','서리 창','비전 방벽'].includes(sk)){if(game.mana<4){msg='마나가 부족하다!';damage=0}else{game.mana-=4;damage=8+game.stats.wis*2+Math.floor(game.mastery.arcane/2);if(sk==='비전 방벽'){game.hp=Math.min(game.maxHp,game.hp+5);damage=Math.floor(damage*.65)}gainMastery('arcane');msg=`${sk} 발동! 마법의 힘으로 ${damage} 피해를 주었다.`}}else if(['관통 사격','정밀 조준','연발 사격'].includes(sk)){damage=6+game.stats.dex*2+Math.floor(game.mastery.bow/2);gainMastery('bow');msg=`${sk}! 정확한 사격으로 ${damage} 피해.`}else if(sk==='치명적 급습'){damage=7+game.stats.dex*2+game.mastery.tracking;gainMastery('tracking');msg=`기습으로 급소를 노려 ${damage} 피해.`}else{damage=7+game.stats.str*2+game.mastery.blade;gainMastery('blade');msg=`${sk}! 검을 휘둘러 ${damage} 피해.`}}else{damage=4+game.stats.str+game.stats.dex+Math.floor(Math.random()*4);gainMastery(game.startMastery==='bow'?'bow':'blade');msg=`무기를 휘둘러 ${damage} 피해를 주었다.`}c.hp=Math.max(0,c.hp-damage);if(c.hp<=0){let loot=c.name.includes('사슴')||c.name.includes('토끼')||c.name.includes('산양')?'말린 식량':'가죽';addItem(loot,1);if(Math.random()<.45)addItem('말린 식량',1);game.gold+=2+Math.floor(Math.random()*4);gainXp(c.xp);log(`${c.name}을(를) 물리쳤다. ${loot}과 은화를 챙겼다.`,'system');game.combat=null;renderCombatResult(msg+` 적을 쓰러뜨렸다! ${loot} 획득, 경험치 ${c.xp}.`);saveGame(false);return}let hit=Math.max(1,c.damage-Math.floor(game.stats.vit/3));game.hp=Math.max(0,game.hp-hit);msg+=` ${c.name}의 반격! 체력 ${hit} 피해.`;if(game.hp<=0){game.hp=Math.ceil(game.maxHp*.45);game.mana=Math.ceil(game.maxMana*.4);game.gold=Math.max(0,game.gold-3);log('전투에서 쓰러졌다. 낯선 약초꾼이 당신을 야영지로 옮겼다. 은화 3개를 잃었다.','system');game.combat=null;renderCombatResult('시야가 흐려진다… 눈을 뜨니 안전한 야영지다. 체력이 일부 회복되었다.');saveGame(false);return}renderCombat(msg);saveGame(false)}
function renderCombatResult(msg){$('#modalRoot').innerHTML=`<div class="modal-back"><div class="modal"><div class="eyebrow">전투 종료</div><h2 class="title">기록이 이어진다</h2><p>${esc(msg)}</p><button class="btn" id="continueBtn">계속 여행하기</button></div></div>`;$('#continueBtn').onclick=()=>{$('#modalRoot').innerHTML='';renderGame()}}
function saveGame(manual=true){if(!game)return;try{localStorage.setItem('ashen-route-save',JSON.stringify(game));if(manual)toast('여정의 기록을 저장했습니다.')}catch(e){if(manual)toast('저장 공간에 접근할 수 없습니다.')}}
function loadGame(){try{let raw=localStorage.getItem('ashen-route-save');if(raw){let data=JSON.parse(raw);if(data&&data.name&&data.inventory&&data.mastery){game=data;$('#creator').classList.add('hidden');$('#game').classList.remove('hidden');renderGame();if(game.combat)renderCombat('전투가 이어진다. 행동을 선택하라.');return}}}catch(e){localStorage.removeItem('ashen-route-save')}renderCreator()}
$('#saveBtn').onclick=()=>game?saveGame(true):toast('아직 여정이 시작되지 않았습니다.');$('#resetBtn').onclick=()=>{if(confirm('현재 여정의 기록을 지우고 새 여정을 시작할까요?')){localStorage.removeItem('ashen-route-save');game=null;create={name:'',gender:'여성',race:'human',stats:{str:2,dex:2,vit:2,wis:2},mastery:'blade'};$('#game').classList.add('hidden');$('#modalRoot').innerHTML='';renderCreator()}};
loadGame();
</script></body></html>
